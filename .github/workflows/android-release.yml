name: Build & Release IssabelGate APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "${SDK_ROOT}/licenses"
          SDK_MGR="$(command -v sdkmanager || find "${SDK_ROOT}" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "${SDK_MGR}" ] && [ -x "${SDK_MGR}" ]; then
            yes | "${SDK_MGR}" --licenses > /dev/null 2>&1 || true
          fi

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: >
          gradle :app:testDebugUnitTest
          --no-daemon
          --no-configuration-cache
          --max-workers=2
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Installable APK (assembleDebug)
        run: >
          gradle :app:assembleDebug
          --no-daemon
          --no-configuration-cache
          --max-workers=2
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Stage APK for Release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="build-${{ github.run_number }}"
          fi
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/IssabelGate-${TAG_NAME}.apk"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"
          ls -lh release-assets/

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IssabelGate-${{ env.RELEASE_TAG }}
          path: release-assets/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: IssabelGate ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*.apk
